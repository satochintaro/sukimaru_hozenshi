<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スキマル保全士 マネージャー Ver 5.2.0 TEST</title><link rel="stylesheet" href="./styles.css"><meta name="theme-color" content="#26323d"></head>
<body class="manager-body"><main class="admin-main"><header class="hd manager-header"><a class="hd-back role-home-link" href="./index.html" aria-label="役割選択へ戻る">‹</a><div class="manager-header-title"><div class="hd-ttl">スキマル保全士</div><div class="hd-sub">MANAGER ／ クラウド提出・集計・教育提案</div></div><button class="manager-logout" id="logout" aria-label="マネージャーからログアウト">退出</button><button class="manager-refresh" id="refresh" aria-label="提出データを更新">↻</button></header>
<div class="pad manager-pad"><div class="manager-connection"><span class="connection-dot" id="connection-dot"></span><span id="connection-text">認証を確認中</span><b id="submission-count">0件</b></div><div class="manager-mode-tabs" role="tablist" aria-label="分析する試験区分"><button class="active" type="button" role="tab" data-analysis-mode="academic">学科分析</button><button type="button" role="tab" data-analysis-mode="practical">実技分析</button></div><div class="acts manager-actions"><button class="btn-g" id="csv-learners">提出一覧CSV</button><button class="btn-g" id="clear">提出データを削除</button></div><div id="ad-rep" class="scroll manager-report"></div>
<div class="player-detail" id="player-detail" aria-hidden="true"><div class="player-detail-card"><button class="player-detail-close" id="player-detail-close" aria-label="閉じる">×</button><div id="player-detail-body"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div></main>
<div class="manager-login" id="manager-login" role="dialog" aria-modal="true" aria-labelledby="login-title"><div class="manager-login-card"><a class="manager-login-back" href="./index.html" aria-label="モード選択へ戻る">‹ モード選択へ戻る</a><div class="manager-login-icon">🔐</div><h1 id="login-title">マネージャー認証</h1><p>Supabase Authに登録した管理者アカウントでログインしてください。</p><label for="manager-email">メールアドレス</label><input id="manager-email" type="email" inputmode="email" autocomplete="username" placeholder="manager@example.com"><label for="manager-password">パスワード</label><input id="manager-password" type="password" autocomplete="current-password" placeholder="パスワード"><button class="btn" id="login-btn">ログイン</button><div class="manager-login-message" id="login-message"></div><small>プレイヤーはログイン不要です。提出結果の閲覧・削除だけを管理者ログインで保護しています。</small></div></div>
<script src="./supabase-config.js"></script><script src="./admin.js"></script></body></html>
