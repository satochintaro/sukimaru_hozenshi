<body class="manager-body quest-v57">
<main class="admin-main">
<header class="hd manager-header">
  <a class="hd-back role-home-link" href="./index.html" aria-label="役割選択へ戻る">‹</a>
  <div class="manager-header-title">
    <div class="hd-ttl">スキマル保全士</div>
    <div class="hd-sub">MANAGER / QUEST UI / 全体・個人分析</div>
  </div>
  <span class="manager-role-badge">開発者</span>
  <button class="manager-logout" id="logout" aria-label="マネージャーからログアウト">退出</button>
  <button class="manager-refresh" id="refresh" aria-label="提出データを更新">↻</button>
</header>

<div class="pad manager-pad">
  <div class="manager-connection">
    <span class="connection-dot" id="connection-dot"></span>
    <span id="connection-text">認証を確認中</span>
    <b id="submission-count">0件</b>
  </div>
  <div class="manager-mode-tabs" role="tablist" aria-label="分析する試験区分">
    <button class="active" type="button" role="tab" data-analysis-mode="academic">学科分析</button>
    <button type="button" role="tab" data-analysis-mode="practical">実技分析</button>
  </div>
  <div class="acts manager-actions">
    <button class="btn-g" id="csv-learners">提出一覧CSV</button>
    
  </div>
  <div class="site-filters"><label>級<select id="manager-grade"><option value="2">2級</option><option value="1">1級</option></select></label><label>拠点<select id="site-filter"><option value="">全拠点</option><option>四日市</option><option>石岡</option><option>足利</option><option>水戸</option><option>真岡</option><option>門真</option><option>北九州</option></select></label><small>拠点情報のない従来データは四日市として表示します。</small></div><div id="ad-rep" class="scroll manager-report"></div>

  <div class="player-detail" id="player-detail" aria-hidden="true">
    <div class="player-detail-card">
      <button class="player-detail-close" id="player-detail-close" aria-label="閉じる">×</button>
      <div id="player-detail-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</main>

<div class="manager-login" id="manager-login" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <div class="manager-login-card">
    <a class="manager-login-back" href="./index.html">‹ モード選択へ戻る</a>
    <div class="manager-login-icon">🔐</div>
    <h1 id="login-title">マネージャー</h1><div class="manager-role-choice"><a class="btn" href="./viewer.html">管理者</a><button class="btn-g" type="button" id="developer-choice">開発者</button></div><div id="developer-fields" hidden>
    <p>開発者用のメールアドレスとパスワードでログインしてください。</p>
    <label for="manager-email">メールアドレス</label>
    <input id="manager-email" type="email" inputmode="email" autocomplete="username" placeholder="メールアドレス">
    <label for="manager-password">パスワード</label>
    <input id="manager-password" type="password" autocomplete="current-password" placeholder="パスワード">
    <button class="btn" id="login-btn">開発者としてログイン</button>
    </div>
    <div class="manager-login-message" id="login-message"></div>
    <small>管理者は閲覧用です。設定変更・登録者データの削除は開発者が行います。</small>
  </div>
</div>

<script src="./supabase-config.js"></script>
