<body class="manager-body viewer-page quest-v57">
<main class="admin-main">
<header class="hd manager-header">
  <a class="hd-back" href="./admin.html" aria-label="マネージャー認証へ戻る">‹</a>
  <div class="manager-header-title">
    <div class="hd-ttl">スキマル保全士</div>
    <div class="hd-sub">MANAGER / QUEST UI / 管理者</div>
  </div>
  <span class="manager-role-badge viewer">管理者</span>
  <button class="manager-logout" id="viewer-logout">拠点変更・退出</button>
  <button class="manager-refresh" id="viewer-refresh">↻</button>
</header>
<div class="pad manager-pad">
  <div class="manager-connection">
    <span class="connection-dot" id="viewer-dot"></span>
    <span id="viewer-connection">認証を確認中</span>
    <b id="viewer-count">0人</b>
  </div>
  <div class="manager-mode-tabs viewer-tabs" role="tablist">
    <button type="button" class="active" data-viewer-mode="combined">総合分析</button>
    <button type="button" data-viewer-mode="academic">学科分析</button>
    <button type="button" data-viewer-mode="practical">実技分析</button>
  </div>
  <div class="site-filters"><label>級<select id="manager-grade"><option value="2">2級</option><option value="1">1級</option></select></label><label>拠点<select id="site-filter"><option value="">全拠点</option><option>四日市</option><option>石岡</option><option>足利</option><option>水戸</option><option>真岡</option><option>門真</option><option>北九州</option></select></label><small>個人成績は担当拠点のみ。他拠点は集計値で比較できます。</small></div><div id="viewer-report" class="scroll manager-report"></div>
</div>
</main>

<div class="player-detail" id="viewer-detail" aria-hidden="true">
  <div class="player-detail-card">
    <button class="player-detail-close" id="viewer-detail-close" aria-label="閉じる">×</button>
    <div id="viewer-detail-body"></div>
  </div>
</div>

<div class="manager-login show" id="viewer-login" role="dialog" aria-modal="true" aria-labelledby="viewer-login-title">
  <div class="manager-login-card">
    <a class="manager-login-back" href="./admin.html">‹ 管理者・開発者の選択へ戻る</a>
    <h1 id="viewer-login-title">管理者ログイン</h1>
    <p id="viewer-manager-identity" role="status"></p>
    <div id="viewer-install-gate" hidden><p>ホーム画面のアイコンから開いてください。</p><button type="button" class="btn" data-open-install>ホーム画面に追加する</button></div>
    <form id="viewer-login-form" method="post" autocomplete="on">
      <div id="viewer-registration-fields"><p>初回のみ、所属拠点と名前を登録します。</p><label for="viewer-home-site">所属拠点</label><select id="viewer-home-site" required></select><label for="viewer-name">名前</label><input id="viewer-name" required maxlength="20" autocomplete="name" placeholder="名前を入力"></div>
      <label for="viewer-view-site">閲覧する拠点</label><select id="viewer-view-site" required></select>
      <label for="viewer-password">パスワード</label><input id="viewer-password" name="password" required type="password" maxlength="72" autocomplete="current-password" placeholder="初回のみ入力">
      <button type="submit" class="btn" id="viewer-login-btn">ログイン</button>
      <p style="font-size:12px;line-height:1.6">認証済みの拠点は、この端末で次回から自動入力。</p>
    </form>
    <details id="viewer-device-settings"><summary>端末の保存設定</summary><p style="font-size:12px;line-height:1.6">拠点パスワードをこの端末に暗号化して保存します。共用端末では利用後に削除してください。閲覧日時・拠点は記録されます。</p><button type="button" class="btn secondary" id="viewer-forget-passwords">保存したパスワードを削除</button></details>
    <div class="manager-login-message" id="viewer-login-message"></div>
  </div>
</div>

<div class="toast" id="viewer-toast" role="status" aria-live="polite"></div>
