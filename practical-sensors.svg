<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="t d"><title id="t">代表的なセンサの検出原理</title><desc id="d">リミットスイッチ、誘導形近接センサ、透過形光電センサの比較図</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#2878b8"/></marker></defs><rect width="960" height="390" rx="22" fill="#f7f9fb"/><text x="35" y="40" font-family="sans-serif" font-size="23" font-weight="800" fill="#26323d">検出方式の見分け方</text><g font-family="sans-serif"><g transform="translate(30 70)"><rect width="285" height="270" rx="15" fill="#fff" stroke="#d8dfe5" stroke-width="3"/><text x="142" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#26323d">リミットスイッチ</text><rect x="62" y="146" width="128" height="70" rx="8" fill="#dfe6eb" stroke="#26323d" stroke-width="4"/><line x1="150" y1="148" x2="205" y2="85" stroke="#26323d" stroke-width="8"/><circle cx="214" cy="74" r="18" fill="#fff" stroke="#26323d" stroke-width="5"/><rect x="230" y="52" width="30" height="85" fill="#8f9aa4"/><path d="M248 41v-25" stroke="#2878b8" stroke-width="4" marker-end="url(#a)"/><text x="142" y="248" text-anchor="middle" font-size="15" fill="#586570">機械的に接触して検出</text></g><g transform="translate(337 70)"><rect width="285" height="270" rx="15" fill="#fff" stroke="#d8dfe5" stroke-width="3"/><text x="142" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#26323d">誘導形近接センサ</text><rect x="48" y="110" width="132" height="58" rx="28" fill="#dcecf5" stroke="#26323d" stroke-width="4"/><path d="M180 117v44" stroke="#2878b8" stroke-width="5"/><rect x="230" y="76" width="30" height="126" fill="#8f9aa4" stroke="#26323d" stroke-width="3"/><path d="M193 101q30 38 0 76M207 88q45 51 0 102" fill="none" stroke="#2878b8" stroke-width="4"/><text x="142" y="224" text-anchor="middle" font-size="15" fill="#586570">金属を非接触で検出</text><text x="142" y="247" text-anchor="middle" font-size="13" fill="#2878b8">高周波磁界の変化</text></g><g transform="translate(644 70)"><rect width="285" height="270" rx="15" fill="#fff" stroke="#d8dfe5" stroke-width="3"/><text x="142" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#26323d">透過形光電センサ</text><rect x="30" y="93" width="55" height="100" rx="8" fill="#dfe6eb" stroke="#26323d" stroke-width="4"/><rect x="200" y="93" width="55" height="100" rx="8" fill="#dfe6eb" stroke="#26323d" stroke-width="4"/><path d="M85 124h115M85 144h115M85 164h115" stroke="#d94841" stroke-width="4" stroke-dasharray="10 7"/><rect x="132" y="76" width="30" height="133" fill="#394754"/><text x="57" y="218" text-anchor="middle" font-size="13" fill="#586570">投光器</text><text x="227" y="218" text-anchor="middle" font-size="13" fill="#586570">受光器</text><text x="142" y="248" text-anchor="middle" font-size="15" fill="#586570">光軸の遮断で検出</text></g></g></svg>
