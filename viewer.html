<html lang="ja">
<head><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://kuioqlwpkvdpudollhpz.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スキマル保全士 閲覧モード Ver 5.7.0 QUEST UI</title>
<meta name="theme-color" content="#172431">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./coach.css">
<link rel="stylesheet" href="./viewer-manager.css">
<link rel="stylesheet" href="./manager-ui-v55.css">

<link rel="stylesheet" href="./member-manager.css?v=11"><link rel="stylesheet" href="./rollout.css?v=13"><script src="./rollout.js?v=14"></script><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="スキマル保全士"><link rel="apple-touch-icon" href="./apple-touch-icon-v14.png"><link rel="icon" href="./icon-v14-192.png"><link rel="stylesheet" href="./app-look-v14.css?v=14"></head>
<body class="manager-body viewer-page quest-v57">
<main class="admin-main">
<header class="hd manager-header">
  <a class="hd-back" href="./admin.html" aria-label="マネージャー認証へ戻る">‹</a>
  <div class="manager-header-title">
    <div class="hd-ttl">スキマル保全士</div>
    <div class="hd-sub">MANAGER / QUEST UI / 管理者</div>
  </div>
  <span class="manager-role-badge viewer">管理者</span>
  <button class="manager-logout" id="viewer-logout">退出</button>
  <button class="manager-refresh" id="viewer-refresh">↻</button>
</header>
<div class="pad manager-pad">
  <div class="manager-connection">
    <span class="connection-dot" id="viewer-dot"></span>
    <span id="viewer-connection">認証を確認中</span>
    <b id="viewer-count">0人</b>
  </div>
  <div class="manager-mode-tabs viewer-tabs" role="tablist">
    <button type="button" class="active" data-viewer-mode="combined">総合分析</button>
    <button type="button" data-viewer-mode="academic">学科分析</button>
    <button type="button" data-viewer-mode="practical">実技分析</button>
  </div>
  <div class="site-filters"><label>拠点<select id="site-filter"><option value="">全拠点</option><option>四日市</option><option>石岡</option><option>足利</option><option>水戸</option><option>真岡</option><option>門真</option><option>北九州</option></select></label><small>個人成績は担当拠点のみ。他拠点は集計値で比較できます。</small></div><div id="viewer-report" class="scroll manager-report"></div>
</div>
</main>

<div class="player-detail" id="viewer-detail" aria-hidden="true">
  <div class="player-detail-card">
    <button class="player-detail-close" id="viewer-detail-close" aria-label="閉じる">×</button>
    <div id="viewer-detail-body"></div>
  </div>
</div>

<div class="manager-login show" id="viewer-login" role="dialog" aria-modal="true" aria-labelledby="viewer-login-title">
  <div class="manager-login-card">
    <a class="manager-login-back" href="./admin.html">‹ 管理者・開発者の選択へ戻る</a>
    <div class="manager-login-icon">👁️</div>
    <h1 id="viewer-login-title">管理者</h1>
    <p>開発者から発行された管理者IDとパスワードを入力してください。担当拠点の成績を閲覧できます。</p>
    <label for="viewer-account">管理者ID</label><input id="viewer-account" autocomplete="username" maxlength="40" placeholder="管理者ID"><label for="viewer-password">管理者パスワード</label>
    <input id="viewer-password" type="password" autocomplete="current-password" placeholder="管理者パスワード">
    <button class="btn" id="viewer-login-btn">管理者画面を開く</button>
    <div class="manager-login-message" id="viewer-login-message"></div>
    <small>閲覧モードでは成績・学科・実技・総合分析のみ確認できます。</small>
  </div>
</div>

<div class="toast" id="viewer-toast" role="status" aria-live="polite"></div>
<script src="./supabase-config.js"></script>
<script src="./coach-shared.js"></script>
<script src="./manager-metrics.js?v=12"></script><script src="./viewer-manager.js?v=15"></script>
<script src="./ui-v57.js"></script>
</body>
</html>
